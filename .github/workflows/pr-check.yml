name: pr-check

# Pull-request gate for the better-opencode fork. Upstream CI targets upstream branches and Blacksmith runners,
# so this workflow uses GitHub-hosted runners and main as the base. Pushes do not run checks; use a pull
# request, or workflow_dispatch when a full run is needed.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    name: check
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # lint:changed diffs against the merge's first parent.
          fetch-depth: 2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Lint
        run: bun run lint

      # CI uses the official TypeScript compiler, matching the upstream check job.
      # Packages unaffected by the pull request were already checked on main, so only the changed
      # packages and their dependents need compiling. A manual run still checks everything.
      - name: Typecheck
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun run typecheck:tsc
          else
            TURBO_SCM_BASE="${{ github.sha }}^1" TURBO_SCM_HEAD="${{ github.sha }}" \
              bun turbo typecheck:tsc --affected --concurrency=3
          fi

      - name: Lint changed files
        if: github.event_name == 'pull_request'
        run: bun run lint:changed HEAD^1

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Check generated OpenAPI document
        working-directory: packages/protocol
        run: bun run check:generated

  test:
    name: test
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # --affected diffs against the merge's first parent; that parent must be in the clone.
          fetch-depth: 2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Ensure ripgrep
        # core's search tests use the system rg when present and otherwise download it, which the test harness blocks.
        run: command -v rg >/dev/null || (sudo apt-get update && sudo apt-get install -y ripgrep)

      - name: Configure git identity
        run: |
          git config --global user.email "ci@better-opencode.local"
          git config --global user.name "better-opencode CI"

      - name: Run unit tests
        timeout-minutes: 35
        env:
          GITHUB_ACTIONS: "false"
        run: |
          # Two suites share the four-vCPU runner, and each runs its files with two worker processes.
          # --no-isolate keeps each worker's module cache warm; the suites pass with it locally.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo test --concurrency=2 -- --parallel=2 --no-isolate
          else
            TURBO_SCM_BASE="${{ github.sha }}^1" TURBO_SCM_HEAD="${{ github.sha }}" \
              bun turbo test --affected --concurrency=2 -- --parallel=2 --no-isolate
          fi

  build:
    name: build
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # --affected diffs against the merge's first parent; that parent must be in the clone.
          fetch-depth: 2

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      # Unit tests import workspace sources, so this only checks that the libraries the CLI and app depend on build.
      - name: Build affected workspace libraries
        timeout-minutes: 25
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bun turbo build --concurrency=2 --filter='@opencode/cli^...'
          else
            TURBO_SCM_BASE="${{ github.sha }}^1" TURBO_SCM_HEAD="${{ github.sha }}" \
              bun turbo build --affected --concurrency=2 --filter='@opencode/cli^...'
          fi
