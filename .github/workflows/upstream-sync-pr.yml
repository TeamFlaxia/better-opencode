name: upstream-sync-pr

# Opens a pull request when a newer stable upstream release is available. It never pushes main,
# creates release tags, or publishes a GitHub Release: merging and tagging stay human decisions.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream stable tag to sync (for example v2.4.3); empty picks the newest"
        required: false
        type: string

concurrency:
  group: upstream-sync-pr
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  UPSTREAM_URL: https://github.com/anomalyco/opencode.git
  GH_TOKEN: ${{ github.token }}

jobs:
  sync:
    name: sync
    if: github.repository == 'TeamFlaxia/better-opencode'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Configure git identity
        run: |
          git config --global user.name "better-opencode CI"
          git config --global user.email "ci@better-opencode.local"

      - name: Resolve upstream release
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          git remote add upstream "$UPSTREAM_URL" 2>/dev/null || git remote set-url upstream "$UPSTREAM_URL"
          git fetch upstream --tags dev

          # The root version is the upstream base last merged into main. Release tags on upstream
          # maintenance branches are not ancestors of dev, so ancestry cannot detect "already synced".
          base="$(bun -p "require('./package.json').version")"
          is_newer() {
            [ "$1" != "$2" ] && [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]
          }

          requested="$REQUESTED_TAG"
          if [ -n "$requested" ]; then
            [[ "$requested" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid tag: $requested"; exit 1; }
            git rev-parse -q --verify "refs/tags/$requested" >/dev/null || { echo "::error::Tag not found: $requested"; exit 1; }
            if git merge-base --is-ancestor "$requested" origin/main; then
              echo "$requested is already merged into main."
              exit 0
            fi
            is_newer "${requested#v}" "$base" || { echo "::error::$requested is not newer than synced base $base"; exit 1; }
            tag="$requested"
          else
            tag=""
            for candidate in $(git tag --list 'v*' --sort=-v:refname); do
              [[ "$candidate" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
              is_newer "${candidate#v}" "$base" || continue
              tag="$candidate"
              break
            done
          fi

          if [ -z "$tag" ]; then
            echo "No newer stable upstream release; main is up to date at $base."
            exit 0
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=upstream-sync-${tag#v}" >> "$GITHUB_OUTPUT"
          echo "Found upstream release $tag (synced base $base)"

      - name: Merge upstream release
        id: merge
        if: steps.release.outputs.tag != ''
        run: |
          tag="${{ steps.release.outputs.tag }}"
          branch="${{ steps.release.outputs.branch }}"
          git switch -c "$branch" origin/main
          git merge --no-ff --no-edit "$tag"

      - name: Report merge conflict
        if: failure() && steps.release.outputs.tag != ''
        run: |
          git merge --abort 2>/dev/null || true
          tag="${{ steps.release.outputs.tag }}"
          title="[upstream-sync] conflict: $tag"
          body=$(cat <<EOF
          Upstream \`$tag\` conflicts with \`main\`. The automation does not resolve conflicts.

          Resolve locally with \`bun run sync:upstream --tag $tag\`, keep the upstream structure and
          re-apply fork features, then push the result and open the PR manually. This issue is
          updated on every failed sync attempt for the same release.
          EOF
          )
          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      - name: Regenerate and verify
        if: steps.release.outputs.tag != '' && success()
        run: |
          bun install --frozen-lockfile
          (cd packages/protocol && bun run generate)
          (cd packages/client && bun run generate)
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: regenerate artifacts for ${{ steps.release.outputs.tag }}"
          fi
          bun run check
          bun run typecheck:tsc
          (cd packages/client && bun run check:generated)
          (cd packages/protocol && bun run check:generated)

      - name: Push branch and open PR
        if: steps.release.outputs.tag != '' && success()
        run: |
          tag="${{ steps.release.outputs.tag }}"
          branch="${{ steps.release.outputs.branch }}"
          expected=$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')
          if [ -n "$expected" ]; then
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" >/dev/null
            git push --force-with-lease="refs/heads/$branch:$expected" origin "HEAD:refs/heads/$branch"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi

          body=$(cat <<EOF
          Automated sync of upstream \`$tag\` into \`main\`.

          - Resolve conflicts by keeping the upstream structure and re-applying fork features.
          - If Protocol or Server \`HttpApi\` changed, regenerate with \`bun run generate\` from \`packages/client\`.
          - Merge this PR, then tag \`${tag#v}-better.1\` (N restarts at 1 for each upstream base version).
          - **This workflow does not push tags or publish a release.**
          - This branch is automation-managed; manual commits to it are overwritten on the next run.

          \`pr-check\` runs lint, typecheck, generated-file checks, tests, and the CLI build on this PR.
          EOF
          )
          title="chore: sync upstream $tag"
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --base main --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "Updated PR #$existing"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --title "$title" --body "$body"
          fi
